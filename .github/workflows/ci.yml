name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Lint (gofmt, go vet)
        run: make lint

      - name: Build
        run: make build

      - name: Unit tests
        run: make test-unit

  integration:
    name: Integration and E2E tests (testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Docker is preinstalled on GitHub-hosted Ubuntu runners;
      # testcontainers starts Postgres and WireMock from the tests themselves.
      - name: Integration tests
        run: make test-integration

      - name: E2E tests
        run: make test-e2e

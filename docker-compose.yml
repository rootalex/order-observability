# Локальное окружение: БД, заглушка платёжки и стек observability.
# Сам order service запускается на хосте: `make run`.
name: orders

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
      POSTGRES_DB: orders
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders -d orders"]
      interval: 2s
      timeout: 3s
      retries: 20

  migrate:
    image: migrate/migrate:v4.17.1
    command: ["-path", "/migrations", "-database", "postgres://orders:orders@postgres:5432/orders?sslmode=disable", "up"]
    volumes:
      - ./migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy

  # Заглушка Payment Service для локального запуска (в тестах WireMock поднимает testcontainers).
  payment-mock:
    image: wiremock/wiremock:3.9.1
    command: ["--verbose"]
    ports:
      - "8081:8080"
    volumes:
      - ./deploy/wiremock/mappings:/home/wiremock/mappings:ro

  # Трейсы: OTLP gRPC 4317 / HTTP 4318, UI http://localhost:16686
  jaeger:
    image: jaegertracing/all-in-one:1.60
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"

  # Метрики: UI http://localhost:9090. Скрейпит order service на хосте (:8080/metrics).
  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --enable-feature=exemplar-storage
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Дашборды: http://localhost:3000 (без логина). Exemplars ведут из метрик в трейсы Jaeger.
  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - jaeger

volumes:
  pgdata:
